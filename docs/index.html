<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Handball 7</title>
<meta name="theme-color" content="#0f1b2d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{
  --bg:#f3f1ec; --karte:#ffffff; --tinte:#14202f; --leise:#6a7280; --linie:#e3e0d8;
  --akzent:#e8590c; --akzent-weich:#fde8dc; --sieg:#1f8a4c; --remis:#b08900; --nied:#c0392b;
  --kopf:#0f1b2d; --kopf-tinte:#f3f1ec; --radius:14px;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b1320;--karte:#141f30;--tinte:#e9edf3;--leise:#8d97a8;--linie:#22304a;
        --akzent-weich:#3a2114;--kopf:#070d17}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tinte);
  font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
header{background:var(--kopf);color:var(--kopf-tinte);padding:calc(14px + env(safe-area-inset-top)) 18px 14px;
  position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px;letter-spacing:.02em;font-weight:800;display:flex;align-items:center;gap:8px}
header h1 span span{color:var(--akzent)}
header .stand{font-size:12px;opacity:.65;margin-top:2px}
main{padding:14px 14px calc(30px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--leise);margin:22px 4px 8px;font-weight:700}
h2:first-child{margin-top:4px}
.karte{background:var(--karte);border-radius:var(--radius);padding:14px;margin-bottom:10px;
  box-shadow:0 1px 0 var(--linie)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--linie);background:var(--karte);color:var(--tinte);border-radius:99px;
  padding:6px 12px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer}
.chip[aria-pressed=true]{background:var(--tinte);color:var(--bg);border-color:var(--tinte)}
.team-kopf{display:flex;align-items:center;justify-content:space-between;gap:10px}
.team-kopf b{font-size:17px}
.platz{font-family:var(--mono);font-size:28px;font-weight:800;color:var(--akzent);line-height:1}
.platz small{font-size:12px;color:var(--leise);font-weight:500;display:block;text-align:right}
.liga-name{font-size:12px;color:var(--leise)}
.spiel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:10px 0;
  border-top:1px solid var(--linie);cursor:pointer}
.spiel:first-child{border-top:0}
.spiel .h{text-align:right}.spiel .g{text-align:left}
.spiel .mein{font-weight:800}
.erg{font-family:var(--mono);font-weight:800;font-size:16px;min-width:74px;text-align:center;
  padding:4px 8px;border-radius:8px;background:var(--bg)}
.erg.zeit{font-weight:600;font-size:14px;color:var(--leise)}
.erg.live{background:var(--nied);color:#fff;animation:puls 1.6s infinite}
@keyframes puls{50%{opacity:.6}}
.erg.S{background:#dff3e6;color:var(--sieg)}.erg.N{background:#f8dedb;color:var(--nied)}.erg.U{background:#f6edc8;color:var(--remis)}
@media (prefers-color-scheme:dark){.erg.S{background:#123323}.erg.N{background:#3a1715}.erg.U{background:#3a3110}}
.meta{grid-column:1/-1;font-size:12px;color:var(--leise);text-align:center;margin-top:-4px}
.tag{font-size:12px;font-weight:700;color:var(--leise);margin:14px 4px 4px;text-transform:uppercase;letter-spacing:.05em}
.form{display:flex;gap:4px}
.form i{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;font-style:normal;
  font-size:11px;font-weight:800;color:#fff}
.form .S{background:var(--sieg)}.form .U{background:var(--remis)}.form .N{background:var(--nied)}
.zwei{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mini{font-size:11px;color:var(--leise);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{white-space:nowrap}
td:nth-child(2){white-space:normal;max-width:40vw;overflow-wrap:anywhere}
th{font-size:11px;color:var(--leise);font-weight:600;text-align:right;padding:6px 3px;border-bottom:1px solid var(--linie)}
td{padding:8px 3px;text-align:right;border-bottom:1px solid var(--linie);font-variant-numeric:tabular-nums}
th:nth-child(2),td:nth-child(2){text-align:left}
td:first-child{color:var(--leise);font-family:var(--mono);width:24px}
tr.mein td{background:var(--akzent-weich);font-weight:700}
tr.klick{cursor:pointer}
td.pkt{font-weight:800}
.tabelle-wrap{overflow-x:auto;padding:8px 8px}
.hinweis{font-size:12px;color:var(--leise);margin:8px 4px}
.leer{color:var(--leise);text-align:center;padding:24px 8px}
.balken{height:6px;background:var(--linie);border-radius:3px;overflow:hidden;margin-top:4px}
.balken div{height:100%;background:var(--akzent)}
.kz{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.kz b{display:block;font-size:20px;font-family:var(--mono)}
.kz span{font-size:11px;color:var(--leise)}
dialog{border:0;border-radius:18px 18px 0 0;padding:0;width:100%;max-width:760px;margin:auto auto 0;
  max-height:88vh;background:var(--bg);color:var(--tinte)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog .innen{padding:18px 14px 30px;overflow:auto;max-height:88vh}
dialog .zu{float:right;background:var(--karte);border:0;border-radius:99px;width:32px;height:32px;
  font-size:18px;cursor:pointer;color:var(--tinte)}
select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--linie);background:var(--karte);color:var(--tinte);width:100%;margin-bottom:10px}
a{color:var(--akzent)}
.fehler{background:#f8dedb;color:#7a1f16;padding:12px;border-radius:12px}
.tkarte{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--karte);border:0;border-radius:var(--radius);
  padding:14px;margin-bottom:10px;box-shadow:0 1px 0 var(--linie);cursor:pointer}
.tkarte:active{transform:scale(.99)}
.tk-kopf{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.tk-kopf b{font-size:17px}
.tk-zeile{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-top:1px solid var(--linie);font-size:14px;min-height:38px}
.tk-lab{width:62px;flex:none;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--leise);font-weight:700}
.tk-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tk-dat{color:var(--leise);font-size:12px;white-space:nowrap}
.tk-zeit{font-size:14px;font-weight:700;white-space:nowrap}
.tk-zeit.live{color:#fff;background:var(--nied);padding:2px 6px;border-radius:6px}
.leise{color:var(--leise)}
.erg-mini{font-family:var(--mono);font-weight:800;font-size:14px;padding:2px 7px;border-radius:6px;background:var(--bg);white-space:nowrap}
.erg-mini.S{background:#dff3e6;color:var(--sieg)}.erg-mini.N{background:#f8dedb;color:var(--nied)}.erg-mini.U{background:#f6edc8;color:var(--remis)}
@media (prefers-color-scheme:dark){.erg-mini.S{background:#123323}.erg-mini.N{background:#3a1715}.erg-mini.U{background:#3a3110}}
.zurueck{background:none;border:0;color:var(--akzent);font:inherit;font-weight:700;padding:4px 0 10px;cursor:pointer}
.team-titel{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
.team-titel b{font-size:22px}
.reiter,.umschalter{display:flex;background:var(--linie);border-radius:12px;padding:3px;gap:3px;margin-bottom:6px}
.reiter button,.umschalter button{flex:1;border:0;background:none;font:inherit;font-size:14px;padding:8px 6px;border-radius:9px;color:var(--leise);cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reiter button[aria-pressed=true],.umschalter button[aria-pressed=true]{background:var(--karte);color:var(--tinte);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.umschalter{margin-top:14px;background:none;border:1px solid var(--linie)}
.umschalter button[aria-pressed=true]{background:var(--tinte);color:var(--bg)}
:root{--s-team:#e8590c;--s-liga:#2f6bd0;--s-schnitt:#14202f}
@media (prefers-color-scheme:dark){:root{--s-liga:#5b8ff0;--s-schnitt:#e9edf3}}
.legende i.strich{width:16px;height:3px;border-radius:2px;vertical-align:3px}
.legende{display:flex;gap:14px;font-size:12px;color:var(--leise);margin:2px 0 6px}
.legende i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
svg.diag{width:100%;height:auto;display:block;overflow:visible}
svg.diag text{fill:var(--leise);font-size:10px;font-family:inherit}
svg.diag .gitter{stroke:var(--linie);stroke-width:1}
svg.diag .treffer{fill:transparent;cursor:pointer}
svg.diag .treffer:hover,svg.diag .treffer.an{fill:var(--tinte);fill-opacity:.05}
.diag-titel{font-size:13px;font-weight:700;margin:4px 0 2px}
.hb{display:grid;grid-template-columns:minmax(0,38%) 1fr 40px;align-items:center;gap:8px;padding:4px 0;font-size:13px}
.hb .name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .spur{position:relative;height:14px}
.hb .spur div{position:absolute;left:0;top:1px;bottom:1px;border-radius:0 4px 4px 0;background:var(--s-liga)}
.hb.mein .spur div{background:var(--s-team)}
.hb.mein .name,.hb.mein .wert{font-weight:800}
.hb .schnitt{position:absolute;top:-3px;bottom:-3px;border-left:2px dashed var(--leise);background:none!important;border-radius:0}
.hb .wert{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
#tip{position:fixed;z-index:20;pointer-events:none;background:var(--tinte);color:var(--bg);font-size:12px;
  padding:6px 9px;border-radius:8px;line-height:1.45;opacity:0;transition:opacity .12s;max-width:220px;white-space:pre-line}
#tip.an{opacity:1}
.quote{display:inline-block;width:46px;height:6px;background:var(--linie);border-radius:3px;vertical-align:middle;margin-left:6px;overflow:hidden}
.quote b{display:block;height:100%;background:var(--s-team)}
.tk-naechst{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.tk-naechst .tk-text{white-space:normal}
.tk-art{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--leise)}
.tk-art.heim{color:var(--akzent)}
.sprung{position:sticky;top:var(--kopfhoehe,62px);z-index:4;background:var(--bg);margin:0 -14px;padding:10px 14px 8px}
[id^="st-"]{scroll-margin-top:calc(var(--kopfhoehe,62px) + 54px)}
.reiter button{line-height:1.15;white-space:normal;font-size:13px;padding:6px 4px}
.karte-g,.karte-r{display:inline-block;min-width:11px;height:14px;border-radius:2px;font-size:10px;line-height:14px;text-align:center;color:#14202f;padding:0 2px}
.karte-g{background:#f2c200}.karte-r{background:#d63a2f;color:#fff}
table.spieler td,table.spieler th{padding-left:4px;padding-right:4px}
ul.scout{margin:0;padding-left:18px}ul.scout li{margin:4px 0}
table.vgl{width:100%}table.vgl td:first-child,table.vgl th:first-child{text-align:left;white-space:normal;font-family:inherit;color:var(--leise);font-size:13px}table.vgl td:not(:first-child),table.vgl th:not(:first-child){text-align:center;font-family:var(--mono)}
</style>
</head>
<body>
<header>
  <h1><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="#e8590c" stroke-width="2.2"/><path d="M4 9c4 1 12 1 16 0M4 15c4-1 12-1 16 0M12 2c-3 4-3 16 0 20" fill="none" stroke="#e8590c" stroke-width="1.6"/></svg><span style="color:inherit">Handball <span>7</span></span></h1>
  <div class="stand" id="stand">lädt …</div>
</header>
<main id="app"></main>
<div id="tip" role="tooltip"></div>
<dialog id="blatt"><div class="innen" id="blatt-innen"></div></dialog>

<script>
"use strict";
const S = { ligen: [], team: null, tab: "spiele", umfang: "team", index: null };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WT = ["So","Mo","Di","Mi","Do","Fr","Sa"];

function datum(iso){ const [d,t]=iso.split("T"); const [y,m,dd]=d.split("-").map(Number); const [h,mi]=(t||"00:00").split(":").map(Number); return new Date(y,m-1,dd,h,mi); }
function tagText(iso){ const d=datum(iso), heute=new Date(); heute.setHours(0,0,0,0);
  const diff=Math.round((new Date(d).setHours(0,0,0,0)-heute)/864e5);
  const basis=`${WT[d.getDay()]}, ${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.`;
  return diff===0?"Heute · "+basis:diff===1?"Morgen · "+basis:diff===-1?"Gestern · "+basis:basis; }
function uhr(iso){ const t=iso.split("T")[1]; return t && t!=="00:00" ? t : "offen"; }
const pkt = t => `${t.punkte}:${t.minus ?? (2*t.n+t.u)}`;
const meinTeam = (liga,id) => liga.meta.meineTeams.some(m => String(m)===String(id));

function ausgang(sp, teamId){
  if (sp.status!=="beendet"||sp.hTore==null) return null;
  const heim=String(sp.heimId)===String(teamId);
  const f=heim?sp.hTore:sp.gTore, g=heim?sp.gTore:sp.hTore;
  return f>g?"S":f<g?"N":"U";
}
function teamSpiele(liga,id){ return liga.spiele.filter(s=>String(s.heimId)===String(id)||String(s.gastId)===String(id)); }
function form(liga,id,n=5){ return teamSpiele(liga,id).map(s=>ausgang(s,id)).filter(Boolean).slice(-n); }
function formHtml(f){ return `<span class="form">${f.map(x=>`<i class="${x}">${x}</i>`).join("")}</span>`; }
function teamName(liga,id){ const t=liga.teams.find(t=>String(t.id)===String(id)); return t?t.name:String(id); }

function spielZeile(liga, sp, sichtTeam){
  let erg, kl="erg";
  if (sp.status==="beendet" && sp.hTore!=null){ erg=`${sp.hTore}:${sp.gTore}`; const a=sichtTeam!=null?ausgang(sp,sichtTeam):null; if(a) kl+=" "+a; }
  else if (sp.status==="live"){ erg=sp.hTore!=null?`${sp.hTore}:${sp.gTore}`:"LIVE"; kl+=" live"; }
  else if (["abgesetzt","verlegt","annulliert"].includes(sp.status)){ erg=sp.status; kl+=" zeit"; }
  else { erg=uhr(sp.datum); kl+=" zeit"; }
  const hm=meinTeam(liga,sp.heimId)?" mein":"", gm=meinTeam(liga,sp.gastId)?" mein":"";
  return `<div class="spiel" data-spiel="${esc(liga.meta.slug)}|${esc(sp.id)}">
    <div class="h${hm}">${esc(sp.heim)}</div><div class="${kl}">${esc(erg)}</div><div class="g${gm}">${esc(sp.gast)}</div>
    <div class="meta">${esc(tagText(sp.datum))}${sp.hz?" · HZ "+esc(sp.hz):""}${sp.halle?" · "+esc(sp.halle):""}</div></div>`;
}

// ------------------------------------------------------------- Seiten
function kurzDatum(iso){ const d=datum(iso); return `${WT[d.getDay()]} ${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.`; }
function gegner(sp,id){ const heim=String(sp.heimId)===String(id); return (heim?"gegen ":"bei ")+(heim?sp.gast:sp.heim); }
function letztesSpiel(l,id){ return teamSpiele(l,id).filter(s=>s.status==="beendet"&&s.hTore!=null).slice(-1)[0]; }
function naechstesSpiel(l,id){ const heute=new Date(); heute.setHours(0,0,0,0);
  return teamSpiele(l,id).find(s=>s.status==="live")||teamSpiele(l,id).find(s=>s.status==="geplant"&&datum(s.datum)>=heute); }
function naechstesText(sp,id){
  const heim=String(sp.heimId)===String(id), wann=sp.status==="live"?"LIVE":`${kurzDatum(sp.datum)}${uhr(sp.datum)!=="offen"?`, ${uhr(sp.datum)} Uhr`:""}`;
  return `<span class="tk-naechst"><span class="tk-art${heim?" heim":""}">${heim?"Heimspiel":"Auswärtsspiel"}</span> <span class="tk-zeit${sp.status==="live"?" live":""}">${wann}</span><span class="tk-text">${heim?"gegen":"in"} ${esc(heim?sp.gast:sp.heim)}</span></span>`;
}
function ergebnisAusSicht(sp,id){ const heim=String(sp.heimId)===String(id); return heim?`${sp.hTore}:${sp.gTore}`:`${sp.gTore}:${sp.hTore}`; }

// Startseite: je Team eine Karte mit Platz, letztem und nächstem Spiel
function seiteUebersicht(){
  const karten=[];
  for (const l of S.ligen) for (const id of l.meta.meineTeams){
    const z=l.tabelle.find(t=>String(t.teamId)===String(id));
    const le=letztesSpiel(l,id), na=naechstesSpiel(l,id);
    if(l.meta.abrufFehler){ karten.push(`<div class="tkarte"><div class="tk-kopf"><div><b>${esc(l.meta.kurz)}</b><div class="liga-name">${esc(l.meta.name)}</div></div></div>
      <div class="tk-zeile"><span class="tk-text leise" style="white-space:normal">${l.meta.quelle==="h4a"?"Handball4All":"handball.net"} lässt den automatischen Abruf zurzeit nicht zu.</span></div>
      <div class="tk-zeile"><a class="tk-text" style="white-space:normal" href="${esc(l.meta.quelle==="handballnet"?`https://www.handball.net/team/${id}`:(l.meta.link||"#"))}" target="_blank" rel="noopener">Spiele &amp; Tabelle auf ${l.meta.quelle==="h4a"?"Handball4All":"handball.net"} ansehen ↗</a></div></div>`); continue; }
    karten.push(`<button class="tkarte" data-oeffne="${esc(l.meta.slug)}|${esc(id)}">
      <div class="tk-kopf"><div><b>${esc(teamName(l,id))}</b><div class="liga-name">${esc(l.meta.kurz)}${l.meta.manuell?` · Stand ${new Date(l.meta.aktualisiert).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}`:""}</div></div>
        ${z?`<div class="platz">${z.platz}.<small>Platz</small></div>`:""}</div>
      <div class="tk-zeile"><span class="tk-lab">Letztes</span>${le?`<span class="erg-mini ${ausgang(le,id)}">${ergebnisAusSicht(le,id)}</span><span class="tk-text">${esc(gegner(le,id))}</span><span class="tk-dat">${kurzDatum(le.datum)}</span>`:`<span class="tk-text leise">noch keins</span>`}</div>
      <div class="tk-zeile"><span class="tk-lab">Nächstes</span>${na?naechstesText(na,id):`<span class="tk-text leise">${l.meta.teildaten?"kommt mit dem ersten Abruf":"keins angesetzt"}</span>`}</div>
    </button>`);
  }
  return karten.length?`<h2>Meine Teams</h2>`+karten.join("")+`<div class="hinweis" style="text-align:center">Team antippen für alle Spiele, Tabelle und Statistik</div>`
    :`<div class="leer">Noch keine Teams eingetragen – in <code>config/ligen.json</code> unter „meine_teams“.</div>`;
}

function spielListe(l, liste, sicht, gruppieren){
  if(!liste.length) return `<div class="karte leer">Keine Spiele.</div>`;
  if(!gruppieren) return `<div class="karte">${liste.map(s=>spielZeile(l,s,sicht)).join("")}</div>`;
  let out="",tag="",karte=[];
  const flush=()=>{ if(karte.length) out+=`<div class="tag">${esc(tag)}</div><div class="karte">${karte.join("")}</div>`; karte=[]; };
  for (const s of liste){ const t=tagText(s.datum); if(t!==tag){flush();tag=t;} karte.push(spielZeile(l,s,l.meta.meineTeams.find(m=>String(m)===String(s.heimId)||String(m)===String(s.gastId)))); }
  flush(); return out;
}

// Teamseite: erst die Spiele des Teams, umschaltbar auf die ganze Liga
function seiteTeam(){
  const l=S.ligen.find(x=>x.meta.slug===S.team.slug); const id=S.team.id;
  if(!l){ S.team=null; return seiteUebersicht(); }
  const z=l.tabelle.find(t=>String(t.teamId)===String(id));
  let inhalt="";
  if(S.tab==="spiele"){
    const heute=new Date(); heute.setHours(0,0,0,0);
    const basis=S.umfang==="liga"?l.spiele:teamSpiele(l,id);
    const kommend=basis.filter(s=>s.status==="live"||(s.status!=="beendet"&&datum(s.datum)>=heute));
    const vorbei=basis.filter(s=>!kommend.includes(s)).reverse();
    inhalt=`<div class="umschalter"><button data-umfang="team" aria-pressed="${S.umfang!=="liga"}">${esc(teamName(l,id))}</button><button data-umfang="liga" aria-pressed="${S.umfang==="liga"}">Ganze Liga</button></div>
      <h2>Nächste Spiele</h2>${spielListe(l,kommend,id,S.umfang==="liga")}
      <h2>Ergebnisse</h2>${spielListe(l,vorbei,id,S.umfang==="liga")}`;
  } else if(S.tab==="gegner") inhalt=seiteGegner(l,id);
  else if(S.tab==="tabelle") inhalt=seiteTabelle();
  else inhalt=seiteStatistik();
  return `<button class="zurueck" data-zurueck>‹ Alle Teams</button>
    <div class="team-titel"><div><b>${esc(teamName(l,id))}</b><div class="liga-name">${esc(l.meta.name)}${l.meta.manuell?` · Stand ${new Date(l.meta.aktualisiert).toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit"})}`:""}</div>
      <div style="margin-top:6px">${formHtml(form(l,id))}</div></div>
      ${z?`<div class="platz">${z.platz}.<small>${pkt(z)} Pkt · ${z.sp} Sp</small></div>`:""}</div>
    <div class="reiter">${[["spiele","Spiele"],["tabelle","Tabelle"],["statistik","Statistik"],["gegner","Nächster Gegner"]].map(([k,n])=>`<button data-tab="${k}" aria-pressed="${S.tab===k}">${n}</button>`).join("")}</div>
    ${inhalt}`;
}

function aktuelleLiga(){ return S.ligen.find(l=>l.meta.slug===(S.team&&S.team.slug))||S.ligen[0]; }

function seiteTabelle(){
  const l=aktuelleLiga(); if(!l) return "";
  const zeilen=l.tabelle.map(t=>`<tr class="klick${meinTeam(l,t.teamId)?" mein":""}" data-team="${esc(l.meta.slug)}|${esc(t.teamId)}">
    <td>${t.platz}</td><td>${esc(teamName(l,t.teamId))}</td><td>${t.sp}</td><td>${t.s}-${t.u}-${t.n}</td>
    <td>${t.tore}:${t.gegentore}</td><td>${t.diff>0?"+":""}${t.diff}</td><td class="pkt">${pkt(t)}</td></tr>`).join("");
  return `<div class="karte tabelle-wrap" style="margin-top:12px"><table><thead><tr><th>#</th><th>Team</th><th>Sp</th><th>S-U-N</th><th>Tore</th><th>+/-</th><th>Pkt</th></tr></thead>
    <tbody>${zeilen||`<tr><td colspan="7" class="leer">Noch keine Tabelle.</td></tr>`}</tbody></table></div>
    ${l.meta.tabelleQuelle==="berechnet"?`<div class="hinweis">Tabelle aus den vorliegenden Ergebnissen berechnet – die Quelle hat keine geliefert. Bei Wertungsentscheidungen kann der offizielle Stand abweichen.</div>`:""}
    ${l.meta.link?`<div class="hinweis"><a href="${esc(l.meta.link)}" target="_blank" rel="noopener">Offizielle Seite öffnen ↗</a></div>`:""}`;
}

function teamWerte(l,id){
  const sp=teamSpiele(l,id).filter(s=>s.status==="beendet"&&s.hTore!=null);
  const w={sp:sp.length,tore:0,gegen:0,heim:[0,0,0],ausw:[0,0,0],hoch:null};
  for (const s of sp){ const heim=String(s.heimId)===String(id); const f=heim?s.hTore:s.gTore,g=heim?s.gTore:s.hTore;
    w.tore+=f; w.gegen+=g; const i=f>g?0:f===g?1:2; (heim?w.heim:w.ausw)[i]++;
    if(f>g&&(!w.hoch||f-g>w.hoch.d)) w.hoch={d:f-g,s}; }
  return w;
}

function seiteStatistik(){
  const l=aktuelleLiga(); if(!l) return "";
  const fertig=l.spiele.filter(s=>s.status==="beendet"&&s.hTore!=null);
  const toreGesamt=fertig.reduce((a,s)=>a+s.hTore+s.gTore,0);
  const heimSiege=fertig.filter(s=>s.hTore>s.gTore).length;
  let html=`${l.meta.berichteNur?`<div class="hinweis" style="background:var(--akzent-weich);padding:10px 12px;border-radius:10px;margin:12px 0 0">Spielberichte ausgewertet: nur die Spiele von ${esc(l.meta.berichteNur.map(id=>teamName(l,id)).join(', '))}. Werte anderer Teams und der Liga-Schnitt beruhen deshalb nur auf diesen Partien.</div>`:""}<h2 id="st-liga" data-nav="Liga">Liga auf einen Blick</h2><div class="karte kz">
    <div><b>${fertig.length}</b><span>Spiele</span></div>
    <div><b>${fertig.length?f1(toreGesamt/fertig.length):"–"}</b><span>Tore/Spiel</span></div>
    <div><b>${fertig.length?Math.round(100*heimSiege/fertig.length)+"%":"–"}</b><span>Heimsiege</span></div></div>`;

  html+=abschnittSpieler(l);
  html+=abschnittSieben(l);
  const teams=l.tabelle.map(t=>({t,w:teamWerte(l,t.teamId),st:l.teamStrafen.find(x=>String(x.teamId)===String(t.teamId))}));
  html+=`<h2 id="st-team" data-nav="Teamwerte">Teamwerte</h2><div class="karte tabelle-wrap"><table><thead><tr><th>#</th><th>Team</th><th>Tore Ø</th><th>Gegen Ø</th><th>Heim</th><th>Ausw.</th><th>2' Ø</th></tr></thead><tbody>`+
    teams.map(({t,w,st})=>`<tr class="klick${meinTeam(l,t.teamId)?" mein":""}" data-team="${esc(l.meta.slug)}|${esc(t.teamId)}"><td>${t.platz}</td><td>${esc(teamName(l,t.teamId))}</td>
      <td>${w.sp?f1(w.tore/w.sp):"–"}</td><td>${w.sp?f1(w.gegen/w.sp):"–"}</td>
      <td>${w.heim.join("-")}</td><td>${w.ausw.join("-")}</td><td>${st&&st.spiele?f1(st.zwei/st.spiele):"–"}</td></tr>`).join("")+`</tbody></table></div>
    <div class="hinweis">Heim/Ausw. = Siege-Unentschieden-Niederlagen. 2' = Zeitstrafen je Spiel (aus Spielberichten).</div>`;

  if (fertig.length){
    const hoch=[...fertig].sort((a,b)=>Math.abs(b.hTore-b.gTore)-Math.abs(a.hTore-a.gTore))[0];
    const viel=[...fertig].sort((a,b)=>(b.hTore+b.gTore)-(a.hTore+a.gTore))[0];
    html+=`<h2 id="st-rek" data-nav="Rekorde">Rekorde</h2><div class="karte"><div class="mini">Höchster Sieg</div>${spielZeile(l,hoch)}<div class="mini" style="margin-top:10px">Torreichstes Spiel</div>${spielZeile(l,viel)}</div>`;
  }
  html+=abschnittSchnitt(l)+abschnittVerlauf(l)+abschnittAuszeit(l)+abschnittZahl(l);
  const nav=[...html.matchAll(/<h2 id="(st-[a-z]+)" data-nav="([^"]+)"/g)].map(m=>`<button class="chip" data-springe="${m[1]}">${m[2]}</button>`).join("");
  return `<div class="chips sprung">${nav}</div>`+html;
}

// ------------------------------------------------------------- Spieler
function abschnittSpieler(l){
  const alle=l.torschuetzen||[];
  const kopf=`<h2 id="st-tors" data-nav="Spieler">Spieler &amp; Torschützen</h2>`;
  if(!alle.length) return kopf+`<div class="karte leer">${l.meta.quelle==="h4a"?"Erscheint, sobald Spielberichte (PDF) ausgelesen wurden.":"Erscheint, sobald Spielberichte abgerufen wurden."}</div>`;
  const teams=l.tabelle.map(t=>({id:String(t.teamId),name:teamName(l,t.teamId)})).sort((a,b)=>a.name.localeCompare(b.name));
  const vor=S.team&&l.meta.slug===S.team.slug?String(S.team.id):"liga";
  const wahl=(S.spielerTeam||{})[l.meta.slug]??vor;
  const liste=wahl==="liga"?alle.filter(p=>p.tore>0).slice(0,25)
    :alle.filter(p=>String(p.teamId)===wahl).sort((a,b)=>b.tore-a.tore||b.spiele-a.spiele||a.name.localeCompare(b.name));

  return kopf+`<select data-spielerwahl="${esc(l.meta.slug)}"><option value="liga"${wahl==="liga"?" selected":""}>Beste Torschützen der Liga</option>${teams.map(t=>`<option value="${esc(t.id)}"${t.id===wahl?" selected":""}>${esc(t.name)}</option>`).join("")}</select>
    <div class="karte tabelle-wrap"><table class="spieler"><thead><tr><th>#</th><th>Spieler</th><th>Sp</th><th>Tore</th><th>Ø</th><th>7m</th><th>2'</th><th><span class="karte-g" title="Gelbe Karten">&nbsp;</span></th><th><span class="karte-r" title="Rote Karten">&nbsp;</span></th></tr></thead><tbody>`+
    (liste.map((p,i)=>`<tr class="${wahl==="liga"&&meinTeam(l,p.teamId)?"mein":""}"><td>${i+1}</td><td>${esc(p.name)}${wahl==="liga"?`<div class="liga-name">${esc(teamName(l,p.teamId))}</div>`:""}<div class="balken"><div style="width:${100*p.tore/max}%"></div></div></td>
      <td>${p.spiele}</td><td class="pkt">${p.tore}</td><td>${p.spiele?f1(p.tore/p.spiele):"–"}</td>
      <td>${p.siebenWuerfe?`${p.siebenTore}/${p.siebenWuerfe}`:"–"}</td><td>${p.zwei||"–"}</td><td>${karte(p.gelb,"g")}</td><td>${karte(p.rot,"r")}</td></tr>`).join("")||`<tr><td colspan="9" class="leer">Keine Spieler.</td></tr>`)+`</tbody></table></div>
    <div class="hinweis">Sp = Spiele auf dem Spielbericht · Ø = Tore je Spiel · 7m = Tore/Würfe · 2' = Zeitstrafen · gelb = Verwarnung · rot = Disqualifikation (auch nach der 3. Zeitstrafe).${wahl==="liga"?" Team oben wählen, um alle Spieler eines Teams zu sehen.":""}</div>`;
}

// ------------------------------------------------------------- 7-Meter
const pz = q => q==null?"–":Math.round(100*q)+"%";
function siebenTeams(l){
  const m={}; for(const p of l.torschuetzen){ const k=String(p.teamId); m[k]=m[k]||{teamId:p.teamId,t:0,w:0}; m[k].t+=p.siebenTore||0; m[k].w+=p.siebenWuerfe||0; }
  return Object.values(m).filter(x=>x.w);
}
function abschnittSieben(l){
  const werfer=l.torschuetzen.filter(p=>p.siebenWuerfe>0);
  if(!werfer.length) return "";
  const teams=siebenTeams(l), T=teams.reduce((a,x)=>a+x.t,0), W=teams.reduce((a,x)=>a+x.w,0);
  const art=S.siebenArt||"werfer";
  let tab;
  if(art==="werfer"){
    const liste=[...werfer].sort((a,b)=>b.siebenTore-a.siebenTore||a.siebenWuerfe-b.siebenWuerfe).slice(0,20);
    tab=`<table><thead><tr><th>#</th><th>Werfer</th><th>Tore/Würfe</th><th>Quote</th></tr></thead><tbody>${liste.map((p,i)=>{const q=p.siebenTore/p.siebenWuerfe;
      return `<tr class="${meinTeam(l,p.teamId)?"mein":""}"><td>${i+1}</td><td>${esc(p.name)}<div class="liga-name">${esc(teamName(l,p.teamId))}</div></td><td>${p.siebenTore}/${p.siebenWuerfe}</td><td>${pz(q)}<span class="quote"><b style="width:${100*q}%"></b></span></td></tr>`;}).join("")}</tbody></table>`;
  } else {
    const liste=teams.map(x=>({...x,q:x.t/x.w})).sort((a,b)=>b.q-a.q||b.w-a.w);
    tab=`<table><thead><tr><th></th><th>Team</th><th>Tore/Würfe</th><th>Quote</th></tr></thead><tbody>${liste.map(x=>`<tr class="${meinTeam(l,x.teamId)?"mein":""}"><td></td><td>${esc(teamName(l,x.teamId))}</td><td>${x.t}/${x.w}</td><td>${pz(x.q)}<span class="quote"><b style="width:${100*x.q}%"></b></span></td></tr>`).join("")}</tbody></table>`;
  }
  return `<h2 id="st-sieben" data-nav="7-Meter">7-Meter</h2><div class="karte kz"><div><b>${W}</b><span>7m-Würfe</span></div><div><b>${pz(W?T/W:null)}</b><span>verwandelt (Liga)</span></div><div><b>${f1(W/Math.max(1,l.spiele.filter(x=>x.status==="beendet"&&x.hTore!=null).length))}</b><span>7m je Spiel</span></div></div>
    <div class="chips"><button class="chip" data-sieben="werfer" aria-pressed="${art==="werfer"}">Je Werfer</button><button class="chip" data-sieben="teams" aria-pressed="${art==="teams"}">Je Team</button></div>
    <div class="karte tabelle-wrap">${tab}</div><div class="hinweis">Aus den Spielberichten. Werfer sortiert nach verwandelten 7m.</div>`;
}

// ------------------------------------------------------------- Über- / Unterzahl
function zahlWerte(x,art){ const sek=x[art+"Sek"], t=x[art+"Tore"], g=x[art+"Gegen"];
  return {min:sek/60/x.spiele, t, g, d:sek?(t-g)/(sek/120):null}; }
const plus = v => v==null?"–":(v>0?"+":"")+f1(v);
function abschnittZahl(l){
  const z=l.verlauf&&l.verlauf.zahl; if(!z||!z.length) return "";
  const art=S.zahlArt||"ue";
  const sum=z.reduce((a,x)=>({spiele:a.spiele+x.spiele,ueSek:a.ueSek+x.ueSek,ueTore:a.ueTore+x.ueTore,ueGegen:a.ueGegen+x.ueGegen,uzSek:a.uzSek+x.uzSek,uzTore:a.uzTore+x.uzTore,uzGegen:a.uzGegen+x.uzGegen}),{spiele:0,ueSek:0,ueTore:0,ueGegen:0,uzSek:0,uzTore:0,uzGegen:0});
  const L=zahlWerte(sum,art);
  const teams=z.map(x=>({x,name:teamName(l,x.teamId),w:zahlWerte(x,art)})).sort((a,b)=>(b.w.d??-99)-(a.w.d??-99));
  return `<h2 id="st-zahl" data-nav="Über-/Unterzahl">Über- &amp; Unterzahl</h2>
    <div class="chips"><button class="chip" data-zahl="ue" aria-pressed="${art==="ue"}">Überzahl</button><button class="chip" data-zahl="uz" aria-pressed="${art==="uz"}">Unterzahl</button></div>
    <div class="karte kz"><div><b>${f1(L.min)}</b><span>Min. je Spiel und Team</span></div><div><b>${L.t}:${L.g}</b><span>Tore : Gegentore (Liga)</span></div><div><b>${plus(L.d)}</b><span>Tordiff. je 2 Min.</span></div></div>
    <div class="karte tabelle-wrap"><table><thead><tr><th></th><th>Team</th><th>Min Ø</th><th>Tore</th><th>+/- je 2'</th></tr></thead><tbody>
    ${teams.map(({x,name,w})=>`<tr class="klick${meinTeam(l,x.teamId)?" mein":""}" data-team="${esc(l.meta.slug)}|${esc(x.teamId)}"><td></td><td>${esc(name)}</td><td>${f1(w.min)}</td><td>${w.t}:${w.g}</td><td class="pkt">${plus(w.d)}</td></tr>`).join("")}</tbody></table></div>
    <div class="hinweis">${art==="ue"?"Überzahl: Beim Gegner läuft mindestens eine Zeitstrafe mehr.":"Unterzahl: Beim eigenen Team läuft mindestens eine Zeitstrafe mehr."} „+/- je 2'“ = eigene Tore minus Gegentore je 2 Minuten in dieser Situation (Liga: ${plus(L.d)}). Grundlage: Zeitstrafen und Disqualifikationen in den Spielberichten.</div>`;
}

// ------------------------------------------------------------- Gegner-Scouting
function kennzahlen(l,id){
  const w=teamWerte(l,id), t=l.tabelle.find(x=>String(x.teamId)===String(id));
  const st=l.teamStrafen.find(x=>String(x.teamId)===String(id));
  const z=l.verlauf?.zahl?.find(x=>String(x.teamId)===String(id));
  const a=l.verlauf?.auszeiten?.find(x=>String(x.teamId)===String(id));
  const s7=siebenTeams(l).find(x=>String(x.teamId)===String(id));
  return {w,t,st,z,a,s7};
}
function seiteGegner(l,id){
  const na=naechstesSpiel(l,id);
  if(!na) return `<div class="karte leer" style="margin-top:12px">Kein kommendes Spiel angesetzt.</div>`;
  const heim=String(na.heimId)===String(id), gid=heim?na.gastId:na.heimId, gname=teamName(l,gid);
  const A=kennzahlen(l,id), B=kennzahlen(l,gid);
  const zeilen=[
    ["Tabellenplatz", k=>k.t?k.t.platz+".":"–"],
    ["Punkte", k=>k.t?pkt(k.t):"–"],
    ["Tore Ø", k=>k.w.sp?f1(k.w.tore/k.w.sp):"–"],
    ["Gegentore Ø", k=>k.w.sp?f1(k.w.gegen/k.w.sp):"–"],
    [heim?"Bilanz (wir heim / sie ausw.)":"Bilanz (wir ausw. / sie heim)", (k,wir)=>((wir===heim)?k.w.heim:k.w.ausw).join("-")],
    ["Zeitstrafen Ø", k=>k.st&&k.st.spiele?f1(k.st.zwei/k.st.spiele):"–"],
    ["Überzahl +/- je 2'", k=>k.z?plus(zahlWerte(k.z,"ue").d):"–"],
    ["Unterzahl +/- je 2'", k=>k.z?plus(zahlWerte(k.z,"uz").d):"–"],
    ["7m-Quote", k=>k.s7?`${pz(k.s7.t/k.s7.w)} <span class="liga-name">${k.s7.t}/${k.s7.w}</span>`:"–"],
    ["Nach Auszeit nächstes Tor", k=>k.a&&(k.a.naechstesEigen+k.a.naechstesGegner)?pz(k.a.naechstesEigen/(k.a.naechstesEigen+k.a.naechstesGegner)):"–"],
  ];
  const werfer=l.torschuetzen.filter(p=>String(p.teamId)===String(gid)&&p.tore>0).slice(0,8);
  const gTore=B.w.tore||1;
  const v=l.verlauf, vt=v?.teams?.find(x=>String(x.teamId)===String(gid));
  let phasen="";
  if(vt&&vt.spiele){
    const pro=a=>a.map(x=>x/vt.spiele), linie={name:"Liga-Schnitt",farbe:"--s-schnitt",werte:v.ligaSchnitt};
    const sT=[{name:gname,farbe:"--s-team",werte:pro(vt.tore)}], sG=[{name:gname,farbe:"--s-liga",werte:pro(vt.gegen)}];
    phasen=`<h2>Wann trifft ${esc(gname)}?</h2>
      <div class="karte"><div class="diag-titel">Geworfene Tore pro Spiel</div>${legende(sT,linie)}${saeulen(v.labels,sT,linie)}</div>
      <div class="karte"><div class="diag-titel">Gegentore pro Spiel</div>${legende(sG,linie)}${saeulen(v.labels,sG,linie)}</div>`;
  }
  // automatische Auffälligkeiten
  const hin=[];
  if(werfer[0]&&B.w.sp){ const ant=werfer[0].tore/(B.w.tore||1); if(ant>=0.2) hin.push(`<b>${esc(werfer[0].name)}</b> wirft ${pz(ant)} der Tore (${f1(werfer[0].tore/werfer[0].spiele)} je Spiel).`); }
  const sieb=l.torschuetzen.filter(p=>String(p.teamId)===String(gid)&&p.siebenWuerfe>0).sort((a,b)=>b.siebenWuerfe-a.siebenWuerfe);
  if(sieb[0]) hin.push(`7m-Schütze meist <b>${esc(sieb[0].name)}</b>: ${sieb[0].siebenTore}/${sieb[0].siebenWuerfe} (${pz(sieb[0].siebenTore/sieb[0].siebenWuerfe)}).`);
  if(vt&&vt.spiele){ const d=(arr)=>arr.map((x,i)=>x/vt.spiele-v.ligaSchnitt[i]);
    const dt=d(vt.tore), dg=d(vt.gegen); const it=dt.indexOf(Math.max(...dt)), ig=dg.indexOf(Math.max(...dg)), iw=dg.indexOf(Math.min(...dg));
    hin.push(`Stärkste Angriffsphase: <b>${esc(v.labels[it])} Min.</b> (${plus(dt[it])} Tore über Schnitt).`);
    hin.push(`Kassiert am meisten in <b>${esc(v.labels[ig])} Min.</b> (${plus(dg[ig])}), am wenigsten in ${esc(v.labels[iw])} Min.`); }
  if(B.z){ const ue=zahlWerte(B.z,"ue").d, uz=zahlWerte(B.z,"uz").d, L=l.verlauf.zahl.reduce((a,x)=>({s:a.s+x.uzSek,t:a.t+x.uzTore,g:a.g+x.uzGegen}),{s:0,t:0,g:0});
    const lUz=L.s?(L.t-L.g)/(L.s/120):null;
    if(uz!=null&&lUz!=null){ const d=uz-lUz;
      hin.push(Math.abs(d)<0.15?`In Unterzahl etwa im Liga-Schnitt (${plus(uz)} je 2 Min.).`:`In Unterzahl ${d>0?"<b>stabiler</b>":"<b>anfälliger</b>"} als der Liga-Schnitt (${plus(uz)} gegen ${plus(lUz)} je 2 Min.) – ${d>0?"eigene Überzahl konsequent ausspielen":"eigene Überzahl ist eine Chance"}.`); } }
  if(B.st&&B.st.spiele&&A.st&&A.st.spiele) hin.push(`Zeitstrafen: ${f1(B.st.zwei/B.st.spiele)} je Spiel (wir: ${f1(A.st.zwei/A.st.spiele)}).`);
  const duelle=l.spiele.filter(x=>x.status==="beendet"&&x.hTore!=null&&((String(x.heimId)===String(id)&&String(x.gastId)===String(gid))||(String(x.heimId)===String(gid)&&String(x.gastId)===String(id))));
  const letzte=teamSpiele(l,gid).filter(x=>x.status==="beendet"&&x.hTore!=null).slice(-5).reverse();
  return `<h2>Nächstes Spiel</h2><div class="karte">${spielZeile(l,na,id)}</div>
    ${hin.length?`<h2>Auffälligkeiten bei ${esc(gname)}</h2><div class="karte"><ul class="scout">${hin.map(h=>`<li>${h}</li>`).join("")}</ul></div>`:""}
    <h2>Vergleich</h2><div class="karte tabelle-wrap"><table class="vgl"><thead><tr><th></th><th>Wir</th><th>Gegner</th></tr></thead><tbody>
      ${zeilen.map(([n,f])=>`<tr><td>${esc(n)}</td><td>${f(A,true)}</td><td>${f(B,false)}</td></tr>`).join("")}</tbody></table></div>
    <h2>Gefährlichste Werfer</h2>${werfer.length?`<div class="karte tabelle-wrap"><table><thead><tr><th>#</th><th>Spieler</th><th>Sp</th><th>Tore</th><th>Ø</th><th>7m</th><th>2'</th></tr></thead><tbody>
      ${werfer.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}<div class="balken"><div style="width:${100*p.tore/werfer[0].tore}%"></div></div></td><td>${p.spiele}</td><td class="pkt">${p.tore}</td><td>${f1(p.tore/p.spiele)}</td><td>${p.siebenWuerfe?`${p.siebenTore}/${p.siebenWuerfe}`:"–"}</td><td>${p.zwei||"–"}</td></tr>`).join("")}</tbody></table></div>`:`<div class="karte leer">Noch keine Spielberichte.</div>`}
    ${phasen}
    ${duelle.length?`<h2>Bisherige Duelle</h2><div class="karte">${duelle.map(x=>spielZeile(l,x,id)).join("")}</div>`:""}
    <h2>Letzte Spiele von ${esc(gname)}</h2><div class="karte">${letzte.map(x=>spielZeile(l,x,gid)).join("")||'<div class="leer">Noch keine.</div>'}</div>
    <div class="hinweis">Alle Werte aus Ergebnissen und Spielberichten dieser Saison.</div>`;
}

// ------------------------------------------------------------- Diagramme
const f1 = x => (Math.round(x*10)/10).toLocaleString("de-DE",{minimumFractionDigits:1,maximumFractionDigits:1});
function schoeneGrenze(m){ if(m<=0) return 1; const p=10**Math.floor(Math.log10(m)); const n=m/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; }

// Säulendiagramm: Gruppen nebeneinander, je Serie eine Säule. Eine Achse, ab 0.
function saeulen(labels, serien, linie){
  const W=340,H=180,L=26,R=4,T=10,B=22, n=labels.length, k=serien.length;
  const max=schoeneGrenze(Math.max(...serien.flatMap(s=>s.werte),...(linie?linie.werte:[]),0.1));
  const y=v=>T+(H-T-B)*(1-v/max), gw=(W-L-R)/n, bw=Math.min(20,(gw-10-2*(k-1))/k);
  let o=`<svg class="diag" viewBox="0 0 ${W} ${H}" role="img">`;
  for(let i=0;i<=4;i++){const v=max*i/4,yy=y(v); o+=`<line class="gitter" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-5}" y="${yy+3}" text-anchor="end">${f1(v).replace(",0","")}</text>`;}
  labels.forEach((lab,i)=>{
    const x0=L+gw*i+(gw-(k*bw+2*(k-1)))/2;
    serien.forEach((s,j)=>{ const v=s.werte[i], x=x0+j*(bw+2), yy=y(v), h=Math.max(0,y(0)-yy), r=Math.min(4,h,bw/2);
      o+=`<path d="M${x},${y(0)}V${yy+r}Q${x},${yy} ${x+r},${yy}H${x+bw-r}Q${x+bw},${yy} ${x+bw},${yy+r}V${y(0)}Z" fill="var(${s.farbe})"/>`; });
    o+=`<text x="${L+gw*i+gw/2}" y="${H-6}" text-anchor="middle">${esc(lab)}</text>`;
  });
  o+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--leise)" stroke-width="1"/>`;
  if(linie){
    const pkt=linie.werte.map((v,i)=>[L+gw*i+gw/2,y(v)]);
    o+=`<polyline points="${pkt.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(${linie.farbe})" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    o+=pkt.map(([x,yy])=>`<circle cx="${x}" cy="${yy}" r="4.5" fill="var(${linie.farbe})" stroke="var(--karte)" stroke-width="2"/>`).join("");
  }
  labels.forEach((lab,i)=>{
    const tip=`Minute ${lab}\n`+serien.map(s=>`${s.name}: ${f1(s.werte[i])}`).join("\n")+(linie?`\n${linie.name}: ${f1(linie.werte[i])}`:"");
    o+=`<rect class="treffer" x="${L+gw*i}" y="${T}" width="${gw}" height="${H-T-B}" data-tip="${esc(tip)}"/>`;
  });
  return o+`</svg>`;
}
function legende(serien, linie){ return `<div class="legende">${serien.map(s=>`<span><i style="background:var(${s.farbe})"></i>${esc(s.name)}</span>`).join("")}${linie?`<span><i class="strich" style="background:var(${linie.farbe})"></i>${esc(linie.name)}</span>`:""}</div>`; }

// Liegende Balken mit gestrichelter Linie für den Liga-Schnitt
function liegendeBalken(zeilen, schnitt, einheit){
  const max=Math.max(...zeilen.map(z=>z.wert),schnitt)*1.06;
  return zeilen.map(z=>`<div class="hb${z.mein?" mein":""}" data-tip="${esc(`${z.name}\n${f1(z.wert)} ${einheit}\nLiga-Schnitt: ${f1(schnitt)}`)}">
    <div class="name">${esc(z.name)}</div><div class="spur"><div style="width:${100*z.wert/max}%"></div><div class="schnitt" style="left:${100*schnitt/max}%"></div></div>
    <div class="wert">${f1(z.wert)}</div></div>`).join("")+`<div class="hinweis" style="margin:6px 0 0">Gestrichelt: Liga-Schnitt (${f1(schnitt)})</div>`;
}

function abschnittSchnitt(l){
  const daten=l.tabelle.map(t=>({id:t.teamId,name:teamName(l,t.teamId),mein:meinTeam(l,t.teamId),w:teamWerte(l,t.teamId)})).filter(d=>d.w.sp);
  if(!daten.length) return "";
  const art=S.schnittArt||"gegen";
  const zeilen=daten.map(d=>({name:d.name,mein:d.mein,wert:(art==="gegen"?d.w.gegen:d.w.tore)/d.w.sp}))
    .sort((a,b)=>art==="gegen"?a.wert-b.wert:b.wert-a.wert);
  const schnitt=daten.reduce((a,d)=>a+d.w.tore,0)/daten.reduce((a,d)=>a+d.w.sp,0);
  return `<h2 id="st-schnitt" data-nav="Tore Ø">Tore &amp; Gegentore pro Spiel</h2><div class="chips"><button class="chip" data-schnitt="gegen" aria-pressed="${art==="gegen"}">Gegentore Ø</button><button class="chip" data-schnitt="tore" aria-pressed="${art==="tore"}">Tore Ø</button></div>
    <div class="karte">${liegendeBalken(zeilen,schnitt,art==="gegen"?"Gegentore/Spiel":"Tore/Spiel")}</div>
    ${art==="gegen"?`<div class="hinweis">Sortiert nach bester Abwehr (wenigste Gegentore oben).</div>`:""}`;
}

function abschnittVerlauf(l){
  const v=l.verlauf;
  if(!v||!v.teams.length) return `<h2 id="st-phasen" data-nav="Torphasen">Wann fallen die Tore?</h2><div class="karte leer">Erscheint, sobald Spielberichte mit Spielminuten vorliegen.</div>`;
  const teams=v.teams.filter(t=>t.spiele).map(t=>({...t,name:teamName(l,t.teamId)})).sort((a,b)=>a.name.localeCompare(b.name));
  const wahl=teams.find(t=>String(t.teamId)===String(S.verlaufTeam?.[l.meta.slug]))||teams.find(t=>S.team&&String(t.teamId)===String(S.team.id))||teams.find(t=>meinTeam(l,t.teamId))||teams[0];
  const pro=a=>a.map(x=>x/wahl.spiele);
  const sTore=[{name:wahl.name,farbe:"--s-team",werte:pro(wahl.tore)}];
  const sGegen=[{name:wahl.name,farbe:"--s-liga",werte:pro(wahl.gegen)}];
  const linie={name:"Liga-Schnitt",farbe:"--s-schnitt",werte:v.ligaSchnitt};
  // Stärkste / schwächste Phase je Team (Abweichung vom Liga-Schnitt)
  const phase=(arr,sp,gross)=>{ let bi=0,bd=-Infinity; arr.forEach((x,i)=>{const d=(x/sp-v.ligaSchnitt[i]);if(d>bd){bd=d;bi=i;}}); return {i:bi,d:bd}; };
  const zeilen=teams.map(t=>{const a=phase(t.tore,t.spiele),b=phase(t.gegen,t.spiele);
    return `<tr class="klick${meinTeam(l,t.teamId)?" mein":""}" data-verlauf="${esc(l.meta.slug)}|${esc(t.teamId)}"><td></td><td>${esc(t.name)}</td>
      <td>${esc(v.labels[a.i])} <span class="liga-name">${a.d>=0?"+":""}${f1(a.d)}</span></td><td>${esc(v.labels[b.i])} <span class="liga-name">${b.d>=0?"+":""}${f1(b.d)}</span></td></tr>`;}).join("");
  return `<h2 id="st-phasen" data-nav="Torphasen">Wann fallen die Tore?</h2>
    <select data-verlaufwahl="${esc(l.meta.slug)}">${teams.map(t=>`<option value="${esc(t.teamId)}"${t===wahl?" selected":""}>${esc(t.name)}</option>`).join("")}</select>
    <div class="karte"><div class="diag-titel">Geworfene Tore pro Spiel</div>${legende(sTore,linie)}${saeulen(v.labels,sTore,linie)}</div>
    <div class="karte"><div class="diag-titel">Gegentore pro Spiel</div>${legende(sGegen,linie)}${saeulen(v.labels,sGegen,linie)}</div>
    <div class="hinweis">Spielzeit in 6 Abschnitte geteilt (2 × ${v.halbzeit} Min.). Die Linie zeigt den Liga-Schnitt pro Abschnitt. Grundlage: ${wahl.spiele} Spiel${wahl.spiele===1?"":"e"} mit Spielbericht. Antippen zeigt die Werte.</div>
    <div class="karte tabelle-wrap"><table><thead><tr><th></th><th>Team</th><th>Wirft am meisten</th><th>Kassiert am meisten</th></tr></thead><tbody>${zeilen}</tbody></table></div>
    <div class="hinweis">Abschnitt mit der größten Abweichung über dem Liga-Schnitt (Tore pro Spiel). Antippen wechselt das Diagramm.</div>`;
}

function abschnittAuszeit(l){
  const v=l.verlauf; if(!v||!v.auszeiten.length) return "";
  const sum=v.auszeiten.reduce((a,x)=>({anzahl:a.anzahl+x.anzahl,e:a.e+x.naechstesEigen,g:a.g+x.naechstesGegner,t:a.t+x.tore3,gg:a.gg+x.gegen3}),{anzahl:0,e:0,g:0,t:0,gg:0});
  const quote=(e,g)=>e+g?e/(e+g):null;
  const ligaQ=quote(sum.e,sum.g);
  const zeile=(name,n,e,g,t,gg,kl="",attr="")=>{const q=quote(e,g);
    return `<tr class="${kl}"${attr}><td></td><td>${esc(name)}</td><td>${n}</td><td>${q==null?"–":Math.round(100*q)+"%"}${q==null?"":`<span class="quote"><b style="width:${100*q}%"></b></span>`}</td><td>${n?(t-gg>0?"+":"")+f1((t-gg)/n):"–"}</td></tr>`;};
  const teams=v.auszeiten.map(x=>({...x,name:teamName(l,x.teamId),q:quote(x.naechstesEigen,x.naechstesGegner)??-1})).sort((a,b)=>b.q-a.q||b.anzahl-a.anzahl);
  return `<h2 id="st-ausz" data-nav="Auszeit">Torerfolg nach Auszeit</h2>
    <div class="karte kz"><div><b>${sum.anzahl}</b><span>Auszeiten</span></div><div><b>${ligaQ==null?"–":Math.round(100*ligaQ)+"%"}</b><span>nächstes Tor eigenes</span></div>
      <div><b>${sum.anzahl?((sum.t-sum.gg)>0?"+":"")+f1((sum.t-sum.gg)/sum.anzahl):"–"}</b><span>Tordiff. 3 Min. danach</span></div></div>
    <div class="karte tabelle-wrap"><table><thead><tr><th></th><th>Team</th><th>Ausz.</th><th>Nächstes Tor</th><th>+/- 3'</th></tr></thead><tbody>
    ${teams.map(x=>zeile(x.name,x.anzahl,x.naechstesEigen,x.naechstesGegner,x.tore3,x.gegen3,meinTeam(l,x.teamId)?"mein":"")).join("")}</tbody></table></div>
    <div class="hinweis">„Nächstes Tor“: Anteil der Auszeiten, nach denen das eigene Team das nächste Tor wirft (Liga: ${ligaQ==null?"–":Math.round(100*ligaQ)+"%"}). „+/- 3'“: Tordifferenz in den 3 Minuten nach der Auszeit, je Auszeit.</div>`;
}

// Tooltip für Diagramme – Maus und Antippen
const tip=document.getElementById("tip"); let tipZiel=null;
function zeigeTip(el,x,y){ document.querySelectorAll(".treffer.an").forEach(r=>r.classList.remove("an")); tipZiel=el; el.classList.add("an");
  tip.textContent=el.dataset.tip; tip.classList.add("an");
  const w=tip.offsetWidth,h=tip.offsetHeight; tip.style.left=Math.max(8,Math.min(innerWidth-w-8,x-w/2))+"px"; tip.style.top=Math.max(8,y-h-14)+"px"; }
function versteckeTip(){ tip.classList.remove("an"); if(tipZiel) tipZiel.classList.remove("an"); tipZiel=null; }
document.addEventListener("pointerover",e=>{ const t=e.target.closest("[data-tip]"); if(t&&e.pointerType==="mouse") zeigeTip(t,e.clientX,e.clientY); });
document.addEventListener("pointermove",e=>{ if(tipZiel&&e.pointerType==="mouse"){ const t=e.target.closest("[data-tip]"); if(t) zeigeTip(t,e.clientX,e.clientY); else versteckeTip(); } });
document.addEventListener("pointerdown",e=>{ const t=e.target.closest("[data-tip]"); if(t&&e.pointerType!=="mouse") zeigeTip(t,e.clientX,e.clientY); else if(!t) versteckeTip(); });
addEventListener("scroll",versteckeTip,{passive:true});
document.addEventListener("change",e=>{ const w=e.target.closest("[data-spielerwahl]"); if(w){ S.spielerTeam={...(S.spielerTeam||{}),[w.dataset.spielerwahl]:w.value}; zeichne(); document.getElementById("st-tors")?.scrollIntoView({block:"start"}); return; } const s=e.target.closest("[data-verlaufwahl]"); if(s){ S.verlaufTeam={...(S.verlaufTeam||{}),[s.dataset.verlaufwahl]:s.value}; zeichne(); } });

// ------------------------------------------------------------- Ablauf
function zeichne(){ document.documentElement.style.setProperty("--kopfhoehe",document.querySelector("header").offsetHeight+"px"); $("#app").innerHTML=S.team?seiteTeam():seiteUebersicht(); }
function oeffneTeam(slug,id){ S.team={slug,id}; S.tab="spiele"; S.umfang="team"; zeichne(); scrollTo(0,0);
  try{ history.pushState({team:true},""); }catch(e){} }
function schliesseTeam(){ S.team=null; zeichne(); scrollTo(0,0); }
addEventListener("popstate",()=>{ if(blatt.open){ blatt.close(); return; } if(S.team) schliesseTeam(); });
document.addEventListener("click",e=>{
  const o=e.target.closest("[data-oeffne]"); if(o){const [a,b]=o.dataset.oeffne.split("|");oeffneTeam(a,b);return;}
  if(e.target.closest("[data-zurueck]")){ try{ if(history.state&&history.state.team){ history.back(); return; } }catch(_){} schliesseTeam(); return; }
  const tb=e.target.closest("[data-tab]"); if(tb){S.tab=tb.dataset.tab;zeichne();return;}
  const um=e.target.closest("[data-umfang]"); if(um){S.umfang=um.dataset.umfang;zeichne();return;}
  const sp=e.target.closest("[data-springe]"); if(sp){document.getElementById(sp.dataset.springe)?.scrollIntoView({behavior:"smooth",block:"start"});return;}
  const za=e.target.closest("[data-zahl]"); if(za){S.zahlArt=za.dataset.zahl;zeichne();return;}
  const si=e.target.closest("[data-sieben]"); if(si){S.siebenArt=si.dataset.sieben;zeichne();return;}
  const sa=e.target.closest("[data-schnitt]"); if(sa){S.schnittArt=sa.dataset.schnitt;zeichne();return;}
  const vw=e.target.closest("[data-verlauf]"); if(vw){const [a,b]=vw.dataset.verlauf.split("|");S.verlaufTeam={...(S.verlaufTeam||{}),[a]:b};zeichne();
    document.querySelector("[data-verlaufwahl]")?.scrollIntoView({behavior:"smooth",block:"start"});return;}
  const t=e.target.closest("[data-team]"); if(t){const [a,b]=t.dataset.team.split("|");teamBlatt(a,b);return;}
  const s=e.target.closest("[data-spiel]"); if(s){const [a,b]=s.dataset.spiel.split("|");spielBlatt(a,b);}
});
const blatt=$("#blatt");
blatt.addEventListener("click",e=>{ if(e.target===blatt) blatt.close(); });

async function lade(){
  try{
    let index, ligen;
    if (window.EINGEBETTET){ index=window.EINGEBETTET.index; ligen=window.EINGEBETTET.ligen; }
    else {
      const r=await fetch("data/index.json",{cache:"no-cache"}); if(!r.ok) throw new Error("index.json fehlt");
      index=await r.json();
      ligen=await Promise.all(index.ligen.map(m=>fetch(`data/${m.slug}.json`,{cache:"no-cache"}).then(r=>r.json())));
    }
    S.index=index; S.ligen=ligen; S.liga=ligen[0]?.meta.slug;
    const d=new Date(index.aktualisiert);
    $("#stand").textContent=`Saison ${index.saison||""} · Stand ${d.toLocaleDateString("de-DE")} ${d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"})}${window.EINGEBETTET?" · Vorschau":""}`;
    zeichne();
  }catch(err){
    $("#app").innerHTML=`<div class="fehler">Daten konnten nicht geladen werden (${esc(err.message)}). Läuft der Abruf schon? Siehe README.</div>`;
    $("#stand").textContent="keine Daten";
  }
}
if ("serviceWorker" in navigator && !window.EINGEBETTET && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
lade();
</script>
